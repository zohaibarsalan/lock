name: Build macOS DMG

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read app metadata
        id: metadata
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          source scripts/app_metadata.sh
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: ./scripts/build_dmg.sh

      - name: Verify checksum
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          cd dist/release
          shasum -a 256 -c "${{ steps.metadata.outputs.app_name }}-${{ steps.metadata.outputs.app_version }}.dmg.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.app_name }}-${{ steps.metadata.outputs.app_version }}-macos-dmg
          path: |
            dist/release/*.dmg
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 14
